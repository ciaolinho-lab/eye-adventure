<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>亮亮精靈護眼平台 - 教師與家長管理專區</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-yellow: #FFD000;
      --primary-cyan: #00E5FF;
      --accent-green: #10B981;
      --bg-gradient: linear-gradient(135deg, #1A1C29 0%, #0F2027 50%, #203A43 100%);
    }

    body {
      margin: 0;
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      background: var(--bg-gradient);
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .nav-bar {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      padding: 12px 24px;
      border-radius: 50px;
      margin-bottom: 24px;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .nav-links {
      display: flex;
      gap: 16px;
    }

    .nav-btn {
      color: white;
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 700;
      background: rgba(255,255,255,0.1);
      transition: all 0.2s ease;
    }

    .nav-btn.active, .nav-btn:hover {
      background: var(--primary-cyan);
      color: #12131C;
    }

    .dashboard-grid {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .dash-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--primary-yellow);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .timer-display {
      font-size: 3rem;
      font-weight: 900;
      color: var(--primary-cyan);
      text-align: center;
      margin: 10px 0;
      font-family: monospace;
    }

    .btn-action {
      background: linear-gradient(90deg, #10B981, #059669);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 16px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .btn-action:hover {
      transform: scale(1.03);
    }

    .checklist-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.05rem;
      background: rgba(255,255,255,0.08);
      padding: 10px 16px;
      border-radius: 14px;
    }

    .checklist-item input {
      width: 20px;
      height: 20px;
      accent-color: var(--primary-yellow);
    }
  </style>
</head>
<body>

  <div class="nav-bar">
    <div style="font-weight: 900; color: var(--primary-yellow); font-size: 1.2rem;">✨ 亮亮精靈護眼平台</div>
    <div class="nav-links">
      <a href="index.html" class="nav-btn">🎬 冒險動畫與互動</a>
      <a href="learning_quiz.html" class="nav-btn">📝 小勇士闖關大測驗</a>
      <a href="teacher_dashboard.html" class="nav-btn active">🏫 教師/家長專區</a>
    </div>
  </div>

  <div class="dashboard-grid">
    <!-- Timer Module -->
    <div class="dash-card">
      <div class="card-title">⏰ 課堂 3010 護眼計時器</div>
      <p style="color: #94A3B8; margin: 0;">協助老師在播放投影或教學時，自動倒數 30 分鐘提醒學生遠眺綠樹休息 10 分鐘。</p>
      <div class="timer-display" id="dash-timer">30:00</div>
      <button class="btn-action" onclick="toggleClassTimer()" id="btn-timer-start">▶️ 開始課堂 30 分鐘計時</button>
    </div>

    <!-- Parent & Teacher Checklist -->
    <div class="dash-card">
      <div class="card-title">📋 每日護眼好習慣打卡</div>
      <div class="checklist-item">
        <input type="checkbox" id="c1" checked>
        <label for="c1">看書坐姿端正，保持 35~40 公分距離</label>
      </div>
      <div class="checklist-item">
        <input type="checkbox" id="c2">
        <label for="c2">用眼 30 分鐘，遠眺 10 分鐘 (護眼 3010)</label>
      </div>
      <div class="checklist-item">
        <input type="checkbox" id="c3">
        <label for="c3">每日戶外活動、曬太陽滿 120 分鐘</label>
      </div>
      <div class="checklist-item">
        <input type="checkbox" id="c4">
        <label for="c4">不在睡前暗處觀看手機與平板螢幕</label>
      </div>
    </div>

    <!-- Student QR Entry Card -->
    <div class="dash-card" style="grid-column: span 2;">
      <div class="card-title">📲 學生掃碼入場與課堂海報</div>
      <p style="color: #94A3B8; margin: 0;">提供美化版 QR Code 與 A4 課堂海報，讓學生透過平板或手機快速掃碼開啟教材與測驗。</p>
      <div style="display: flex; gap: 20px; align-items: center; background: rgba(0,0,0,0.3); padding: 16px; border-radius: 16px; margin-top: 8px;">
        <img id="dash-qr-img" src="assets/eye_adventure_qr.png" alt="QR Code" style="width: 140px; height: auto; border-radius: 12px; border: 2px solid var(--accent-green);">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 10px;">
          <div style="font-weight: 700; color: var(--primary-cyan); font-size: 1.1rem;">當前平台入口網址:</div>
          <code id="dash-url-code" style="background: rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 8px; color: #38BDF8; font-size: 0.95rem; word-break: break-all;">載入中...</code>
          <div style="display: flex; gap: 12px; flex-wrap: wrap;">
            <a href="classroom_poster.html" class="btn-action" style="text-decoration: none; text-align: center; font-size: 0.95rem; flex: 1; min-width: 180px;">🖨️ 開啟 A4 課堂海報</a>
            <button class="btn-action" style="background: #3B82F6; font-size: 0.95rem; flex: 1; min-width: 180px;" onclick="window.open(document.getElementById('dash-qr-img').src, '_blank')">🔍 查看原圖高畫質 QR</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let timerSeconds = 30 * 60;
    let timerRunning = false;
    let timerInterval = null;

    function toggleClassTimer() {
      const btn = document.getElementById('btn-timer-start');
      if (!timerRunning) {
        timerRunning = true;
        btn.innerText = '⏸️ 暫停計時';
        btn.style.background = 'linear-gradient(90deg, #EF4444, #DC2626)';

        timerInterval = setInterval(() => {
          if (timerSeconds > 0) {
            timerSeconds--;
            const mins = Math.floor(timerSeconds / 60);
            const secs = timerSeconds % 60;
            document.getElementById('dash-timer').innerText = 
              `${mins < 10 ? '0' + mins : mins}:${secs < 10 ? '0' + secs : secs}`;
          } else {
            clearInterval(timerInterval);
            alert("🔔 叮咚！30 分鐘到了！請全班小朋友站起來，望向遠方綠樹休息 10 分鐘喔！");
          }
        }, 1000);
      } else {
        timerRunning = false;
        clearInterval(timerInterval);
        btn.innerText = '▶️ 繼續計時';
        btn.style.background = 'linear-gradient(90deg, #10B981, #059669)';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const entryUrl = window.location.href.replace('teacher_dashboard.html', 'index.html');
      document.getElementById('dash-url-code').innerText = entryUrl;
    });
  </script>
</body>
</html>
