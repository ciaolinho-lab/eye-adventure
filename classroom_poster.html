<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>亮亮精靈護眼大冒險 - 課堂學生掃碼入口海報</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    @page {
      size: A4 portrait;
      margin: 0;
    }
    
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      background: #0F172A;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .nav-bar {
      width: 100%;
      max-width: 700px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      padding: 12px 24px;
      border-radius: 50px;
      margin-bottom: 24px;
      border: 1px solid rgba(255,255,255,0.15);
      flex-wrap: wrap;
      gap: 10px;
    }

    .nav-links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-btn {
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
      background: rgba(255,255,255,0.1);
      transition: all 0.2s ease;
    }

    .nav-btn.active, .nav-btn:hover {
      background: #00E5FF;
      color: #12131C;
    }

    .poster-card {
      width: 100%;
      max-width: 700px;
      background: linear-gradient(145deg, #1E293B, #0F172A);
      border: 4px solid #10B981;
      border-radius: 32px;
      padding: 36px 30px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      position: relative;
    }

    .header-tag {
      display: inline-block;
      background: #FFD000;
      color: #0F172A;
      font-weight: 900;
      font-size: 1.1rem;
      padding: 8px 24px;
      border-radius: 30px;
      margin-bottom: 12px;
      box-shadow: 0 4px 15px rgba(255, 208, 0, 0.4);
    }

    h1 {
      font-size: 2.3rem;
      margin: 10px 0;
      color: #FFFFFF;
      text-shadow: 0 0 20px rgba(0,229,255,0.4);
    }

    p.subtitle {
      font-size: 1.1rem;
      color: #94A3B8;
      margin-bottom: 20px;
    }

    .qr-frame {
      background: #FFFFFF;
      padding: 16px;
      border-radius: 24px;
      display: inline-block;
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
      margin: 10px 0;
    }

    .qr-frame img {
      width: 260px;
      height: auto;
      display: block;
    }

    .url-badge {
      background: rgba(15, 23, 42, 0.8);
      border: 2px dashed #38BDF8;
      color: #38BDF8;
      font-family: monospace;
      font-size: 1.15rem;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: 16px;
      margin: 15px auto;
      display: inline-block;
      word-break: break-all;
      max-width: 90%;
    }

    .instructions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
      margin-top: 24px;
    }

    @media (max-width: 600px) {
      .instructions-grid {
        grid-template-columns: 1fr;
      }
    }

    .step-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 14px;
    }

    .step-num {
      width: 32px;
      height: 32px;
      background: #10B981;
      color: white;
      border-radius: 50%;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 8px auto;
    }

    .print-actions {
      margin-top: 25px;
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-print {
      background: linear-gradient(90deg, #10B981, #059669);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(16,185,129,0.4);
      transition: transform 0.2s ease;
    }

    .btn-print:hover {
      transform: scale(1.03);
    }

    @media print {
      body {
        background: white;
        color: black;
        padding: 0;
      }
      .nav-bar, .print-actions, .toggle-bar { display: none !important; }
      .poster-card {
        border-color: #047857;
        background: white;
        color: black;
        box-shadow: none;
        max-width: 100%;
        width: 100%;
      }
      h1 { color: #0F172A; text-shadow: none; }
      p.subtitle { color: #475569; }
      .step-box { border-color: #CBD5E1; background: #F8FAFC; color: black; }
      .url-badge { border-color: #0284C7; color: #0369A1; background: #F0F9FF; }
    }
  </style>
</head>
<body>

  <div class="nav-bar">
    <div style="font-weight: 900; color: #FFD000; font-size: 1.1rem;">✨ 亮亮精靈護眼平台</div>
    <div class="nav-links">
      <a href="index.html" class="nav-btn">🎬 冒險動畫與互動</a>
      <a href="learning_quiz.html" class="nav-btn">📝 小勇士闖關大測驗</a>
      <a href="teacher_dashboard.html" class="nav-btn">🏫 教師/家長專區</a>
      <a href="classroom_poster.html" class="nav-btn active">📲 學生掃碼</a>
    </div>
  </div>

  <div class="poster-card">
    <div class="header-tag">✨ 兒童護眼互動體驗平台</div>
    <h1>亮亮精靈的眼球大冒險</h1>
    <p class="subtitle">請用平板或手機相機，掃描下方 QR Code 立即連線入場！</p>

    <div class="qr-frame">
      <img id="poster-qr-img" src="assets/eye_adventure_qr.png" alt="學生入場 QR Code">
    </div>

    <div>
      <div class="url-badge" id="display-url">連線網址：https://ciaolinho-lab.github.io/eye-adventure/</div>
    </div>

    <div class="toggle-bar" style="margin-top: 8px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
      <button class="btn-print" style="background: #0284C7; font-size: 0.9rem; padding: 8px 16px;" onclick="switchQR('cloud')">🌐 雲端 Pages QR</button>
      <button class="btn-print" style="background: #059669; font-size: 0.9rem; padding: 8px 16px;" onclick="switchQR('lan')">📡 課堂區網 QR</button>
      <button class="btn-print" style="background: #8B5CF6; font-size: 0.9rem; padding: 8px 16px;" onclick="copyCurrentUrl()">📋 複製連線網址</button>
    </div>

    <div class="instructions-grid">
      <div class="step-box">
        <div class="step-num">1</div>
        <div style="font-weight:700;">開啟相機</div>
        <div style="font-size:0.85rem; color:#94A3B8; margin-top:4px;">開啟手機/平板內建相機或 LINE 掃碼</div>
      </div>
      <div class="step-box">
        <div class="step-num">2</div>
        <div style="font-weight:700;">對準 QR Code</div>
        <div style="font-size:0.85rem; color:#94A3B8; margin-top:4px;">點擊出現的連結彈窗或網址卡片</div>
      </div>
      <div class="step-box">
        <div class="step-num">3</div>
        <div style="font-weight:700;">開始冒險測驗</div>
        <div style="font-size:0.85rem; color:#94A3B8; margin-top:4px;">享受互動動畫並挑戰護眼小勇士認證</div>
      </div>
    </div>

    <div class="print-actions">
      <button class="btn-print" onclick="window.print()">🖨️ 列印 A4 海報 (Ctrl+P)</button>
      <button class="btn-print" style="background:#3B82F6;" onclick="window.location.href='teacher_dashboard.html'">🔙 返回教師管理區</button>
    </div>
  </div>

  <script>
    function updateUrlDisplay() {
      let currentUrl = window.location.href.replace('classroom_poster.html', 'index.html');
      if (location.hostname.includes('github.io')) {
        currentUrl = 'https://ciaolinho-lab.github.io/eye-adventure/';
      }
      document.getElementById('display-url').innerText = `連線網址：${currentUrl}`;
    }

    function switchQR(type) {
      const img = document.getElementById('poster-qr-img');
      if (type === 'cloud') {
        img.src = 'assets/cloud_qr_code.png';
      } else if (type === 'lan') {
        img.src = 'assets/lan_qr_code.png';
      } else {
        img.src = 'assets/eye_adventure_qr.png';
      }
    }

    function copyCurrentUrl() {
      const currentUrl = document.getElementById('display-url').innerText.replace('連線網址：', '');
      navigator.clipboard.writeText(currentUrl).then(() => {
        alert('✅ 網址已成功複製到剪貼簿！');
      }).catch(() => {
        prompt('請手動複製網址：', currentUrl);
      });
    }

    window.addEventListener('DOMContentLoaded', updateUrlDisplay);
  </script>
</body>
</html>
