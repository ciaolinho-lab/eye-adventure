<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>亮亮精靈護眼大冒險 - 課堂學生掃碼入口海報</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    @page {
      size: A4 portrait;
      margin: 0;
    }
    
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      background: #0F172A;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .poster-card {
      width: 90%;
      max-width: 700px;
      background: linear-gradient(145deg, #1E293B, #0F172A);
      border: 4px solid #10B981;
      border-radius: 32px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      position: relative;
    }

    .header-tag {
      display: inline-block;
      background: #FFD000;
      color: #0F172A;
      font-weight: 900;
      font-size: 1.2rem;
      padding: 8px 24px;
      border-radius: 30px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(255, 208, 0, 0.4);
    }

    h1 {
      font-size: 2.5rem;
      margin: 10px 0;
      color: #FFFFFF;
      text-shadow: 0 0 20px rgba(0,229,255,0.4);
    }

    p.subtitle {
      font-size: 1.2rem;
      color: #94A3B8;
      margin-bottom: 24px;
    }

    .qr-frame {
      background: #FFFFFF;
      padding: 20px;
      border-radius: 24px;
      display: inline-block;
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
      margin: 10px 0;
    }

    .qr-frame img {
      width: 280px;
      height: auto;
      display: block;
    }

    .url-badge {
      background: rgba(15, 23, 42, 0.8);
      border: 2px dashed #38BDF8;
      color: #38BDF8;
      font-family: monospace;
      font-size: 1.3rem;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 16px;
      margin: 20px auto;
      display: inline-block;
      word-break: break-all;
    }

    .instructions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      margin-top: 30px;
    }

    .step-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px;
    }

    .step-num {
      width: 32px;
      height: 32px;
      background: #10B981;
      color: white;
      border-radius: 50%;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 8px auto;
    }

    .print-actions {
      margin-top: 30px;
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    .btn-print {
      background: linear-gradient(90deg, #10B981, #059669);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(16,185,129,0.4);
    }

    .btn-print:hover {
      transform: scale(1.05);
    }

    @media print {
      body {
        background: white;
        color: black;
      }
      .poster-card {
        border-color: #047857;
        background: white;
        color: black;
        box-shadow: none;
      }
      h1 { color: #0F172A; text-shadow: none; }
      p.subtitle { color: #475569; }
      .print-actions { display: none; }
      .step-box { border-color: #CBD5E1; background: #F8FAFC; color: black; }
    }
  </style>
</head>
<body>

  <div class="poster-card">
    <div class="header-tag">✨ 兒童護眼互動體驗平台</div>
    <h1>亮亮精靈的眼球大冒險</h1>
    <p class="subtitle">請用平板或手機相機，掃描下方 QR Code 立即連線入場！</p>

    <div class="qr-frame">
      <img id="poster-qr-img" src="assets/eye_adventure_qr.png" alt="學生入場 QR Code">
    </div>

    <div>
      <div class="url-badge" id="display-url">連線網址：載入中...</div>
    </div>

    <div style="margin-top: 10px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
      <button class="btn-print" style="background: #0284C7; font-size: 0.95rem; padding: 8px 18px;" onclick="switchQR('cloud')">🌐 雲端正式版 QR</button>
      <button class="btn-print" style="background: #059669; font-size: 0.95rem; padding: 8px 18px;" onclick="switchQR('lan')">📡 課堂區網版 QR</button>
      <button class="btn-print" style="background: #8B5CF6; font-size: 0.95rem; padding: 8px 18px;" onclick="copyCurrentUrl()">📋 複製網址</button>
    </div>

    <div class="instructions-grid">
      <div class="step-box">
        <div class="step-num">1</div>
        <div style="font-weight:700;">開啟相機</div>
        <div style="font-size:0.85rem; color:#94A3B8; margin-top:4px;">打開平板/手機內建相機或 LINE 掃碼器</div>
      </div>
      <div class="step-box">
        <div class="step-num">2</div>
        <div style="font-weight:700;">對準 QR Code</div>
        <div style="font-size:0.85rem; color:#94A3B8; margin-top:4px;">點擊出現的網址連結彈窗</div>
      </div>
      <div class="step-box">
        <div class="step-num">3</div>
        <div style="font-weight:700;">開始冒險測驗</div>
        <div style="font-size:0.85rem; color:#94A3B8; margin-top:4px;">享受互動動畫並挑戰護眼小勇士認證</div>
      </div>
    </div>

    <div class="print-actions">
      <button class="btn-print" onclick="window.print()">🖨️ 列印課堂海報 (Ctrl+P)</button>
      <button class="btn-print" style="background:#3B82F6;" onclick="window.location.href='teacher_dashboard.html'">🔙 返回教師管理區</button>
    </div>
  </div>

  <script>
    function updateUrlDisplay() {
      const currentUrl = window.location.href.replace('classroom_poster.html', 'index.html');
      document.getElementById('display-url').innerText = `連線網址：${currentUrl}`;
    }

    function switchQR(type) {
      const img = document.getElementById('poster-qr-img');
      if (type === 'cloud') {
        img.src = 'assets/cloud_qr_code.png';
      } else if (type === 'lan') {
        img.src = 'assets/lan_qr_code.png';
      } else {
        img.src = 'assets/eye_adventure_qr.png';
      }
    }

    function copyCurrentUrl() {
      const currentUrl = window.location.href.replace('classroom_poster.html', 'index.html');
      navigator.clipboard.writeText(currentUrl).then(() => {
        alert('✅ 網址已複製到剪貼簿！');
      }).catch(() => {
        prompt('請手動複製此網址：', currentUrl);
      });
    }

    window.addEventListener('DOMContentLoaded', updateUrlDisplay);
  </script>

</body>
</html>
