<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>亮亮精靈護眼小勇士大闖關 - 測驗與證書</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-yellow: #FFD000;
      --primary-cyan: #00E5FF;
      --accent-green: #10B981;
      --accent-pink: #FF4081;
      --bg-gradient: linear-gradient(135deg, #1A1C29 0%, #0F2027 50%, #203A43 100%);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      background: var(--bg-gradient);
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .nav-bar {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      padding: 12px 24px;
      border-radius: 50px;
      margin-bottom: 24px;
      border: 1px solid rgba(255,255,255,0.15);
      flex-wrap: wrap;
      gap: 10px;
    }

    .nav-links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-btn {
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
      background: rgba(255,255,255,0.1);
      transition: all 0.2s ease;
    }

    .nav-btn.active, .nav-btn:hover {
      background: var(--primary-cyan);
      color: #12131C;
    }

    .quiz-card {
      width: 100%;
      max-width: 800px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 28px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .q-title {
      font-size: 1.4rem;
      color: var(--primary-yellow);
      margin-top: 15px;
      line-height: 1.4;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 20px;
    }

    @media (max-width: 600px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 18px;
      font-size: 1.1rem;
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .option-btn:hover {
      background: rgba(255, 208, 0, 0.25);
      border-color: var(--primary-yellow);
      transform: translateY(-2px);
    }

    .score-badge {
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--primary-cyan);
    }

    /* Feedback Banner */
    .feedback-banner {
      display: none;
      padding: 16px 24px;
      border-radius: 20px;
      margin-top: 20px;
      font-weight: 700;
      font-size: 1.1rem;
      animation: fadeIn 0.3s ease;
    }

    .feedback-banner.correct {
      background: rgba(16, 185, 129, 0.3);
      border: 2px solid #10B981;
      color: #A7F3D0;
    }

    .feedback-banner.incorrect {
      background: rgba(239, 68, 68, 0.3);
      border: 2px solid #EF4444;
      color: #FCA5A5;
    }

    .btn-next {
      background: linear-gradient(90deg, #10B981, #059669);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 25px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      margin-top: 15px;
      display: none;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
    }

    /* Input Card */
    .input-box {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 20px;
    }

    .input-field {
      padding: 14px 20px;
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: rgba(0, 0, 0, 0.3);
      color: white;
      font-size: 1.2rem;
      font-family: inherit;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--primary-cyan);
    }

    /* Certificate Modal */
    .certificate-box {
      display: none;
      background: #FFFDF0;
      color: #1E293B;
      border: 10px solid #D97706;
      border-radius: 24px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 0 50px rgba(255, 208, 0, 0.8);
      position: relative;
    }

    .cert-title {
      font-size: 2.4rem;
      color: #B45309;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .cert-name {
      font-size: 2.2rem;
      color: #047857;
      border-bottom: 4px dashed #047857;
      display: inline-block;
      padding: 0 24px;
      margin: 15px 0;
      font-weight: 900;
    }

    .cert-seal {
      width: 90px;
      height: 90px;
      background: #F59E0B;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.1rem;
      margin: 20px auto 0;
      box-shadow: 0 5px 15px rgba(245, 158, 11, 0.5);
    }

    @media print {
      body { background: white; color: black; padding: 0; }
      .nav-bar, .cert-actions { display: none !important; }
      .certificate-box { border-color: #B45309; box-shadow: none; width: 100%; max-width: none; }
    }
  </style>
</head>
<body>

  <div class="nav-bar">
    <div style="font-weight: 900; color: var(--primary-yellow); font-size: 1.2rem;">✨ 亮亮精靈護眼平台</div>
    <div class="nav-links">
      <a href="index.html" class="nav-btn">🎬 冒險動畫與互動</a>
      <a href="learning_quiz.html" class="nav-btn active">📝 小勇士闖關大測驗</a>
      <a href="teacher_dashboard.html" class="nav-btn">🏫 教師/家長專區</a>
      <a href="classroom_poster.html" class="nav-btn" style="background: rgba(16,185,129,0.2); color: #10B981;">📲 學生掃碼</a>
    </div>
  </div>

  <!-- Start Welcome Card -->
  <div class="quiz-card" id="start-card">
    <h2 style="color: var(--primary-yellow); margin-top: 0;">🛡️ 歡迎來到護眼小勇士闖關考驗！</h2>
    <p style="font-size: 1.1rem; color: #E2E8F0; line-height: 1.6;">
      請輸入你的名字或暱稱，挑戰 5 道護眼生活大考驗！<br>
      全對即可解鎖【亮亮精靈護眼小勇士榮譽證書】喔！
    </p>
    <div class="input-box">
      <input type="text" id="student-name-input" class="input-field" placeholder="請輸入小勇士姓名 (例：王小明)" value="護眼智慧小達人">
      <button class="option-btn" style="background: linear-gradient(90deg, #10B981, #059669); text-align: center;" onclick="startQuiz()">🚀 開始闖關測驗</button>
    </div>
  </div>

  <!-- Main Quiz Card -->
  <div class="quiz-card" id="quiz-card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span style="font-size: 1rem; color: #94A3B8;" id="progress-text">關卡進度：1 / 5</span>
      <span class="score-badge" id="score-text">目前得分：0 分</span>
    </div>

    <h2 class="q-title" id="question-text">載入中...</h2>
    <div class="options-grid" id="options-container"></div>

    <div class="feedback-banner" id="feedback-banner"></div>
    <button class="btn-next" id="btn-next" onclick="nextQuestion()">下一題 ➔</button>
  </div>

  <!-- Certificate View -->
  <div class="certificate-box" id="certificate-box" style="width: 100%; max-width: 750px;">
    <div class="cert-title">🏆 護眼小勇士榮譽證書</div>
    <p style="font-size: 1.2rem; color: #475569;">恭喜順利通過 100 分護眼關卡考驗！</p>
    <div>茲證明護眼勇士</div>
    <div class="cert-name" id="user-cert-name">王小明</div>
    <p style="font-size: 1.15rem; line-height: 1.8; color: #334155;">
      熟記「<b>看書看電視 30 分鐘休息 10 分鐘</b>」與「<b>每日戶外活動 120 分鐘</b>」護眼密碼！<br>
      保持良好坐姿與閱讀距離，特頒此證，以茲鼓勵！
    </p>
    <div style="font-size: 0.95rem; color: #64748B; margin-top: 10px;" id="cert-date-str">頒發日期：2026 年 10 月 4 日</div>
    <div class="cert-seal">亮亮精靈<br>認證</div>
    <div class="cert-actions" style="margin-top: 25px; display: flex; gap: 16px; justify-content: center;">
      <button onclick="window.print()" style="padding: 12px 30px; background: #047857; color: white; border: none; border-radius: 25px; font-size: 1.1rem; font-weight: 900; cursor: pointer;">🖨️ 列印/儲存證書 (Ctrl+P)</button>
      <button onclick="location.reload()" style="padding: 12px 24px; background: #3B82F6; color: white; border: none; border-radius: 25px; font-size: 1.1rem; font-weight: 900; cursor: pointer;">🔄 重新挑戰</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        q: "第 1 題：看電視、玩平板或讀書滿 30 分鐘，應該要休息幾分鐘呢？",
        options: ["A. 1 分鐘", "B. 10 分鐘 (護眼 3010)", "C. 不用休息", "D. 60 分鐘"],
        correct: 1,
        explanation: "🎯 沒錯！「護眼 3010 密碼」提醒我們每用眼 30 分鐘，就要休息 10 分鐘喔！"
      },
      {
        q: "第 2 題：每天應該去戶外活動、曬太陽多久，最能幫助眼睛預防近視？",
        options: ["A. 10 分鐘", "B. 30 分鐘", "C. 2 小時 (戶外 120 分鐘)", "D. 5 小時"],
        correct: 2,
        explanation: "☀️ 太棒了！陽光能刺激眼球分泌多巴胺，每天戶外活動 120 分鐘是護眼關鍵！"
      },
      {
        q: "第 3 題：看書或寫作業時，眼睛和書本應該保持多少距離最合適？",
        options: ["A. 5 公分", "B. 35~40 公分 (約一隻手臂距離)", "C. 貼在桌上", "D. 越多越好"],
        correct: 1,
        explanation: "📖 正確！保持 35~40 公分距離，姿勢坐端正，眼睛才不會過度疲勞。"
      },
      {
        q: "第 4 題：當『霧濛濛怪獸』出現在眼前時，代表發生了什麼事？",
        options: ["A. 眼睛太有精神了", "B. 眼睛累了、視力變得模糊近視", "C. 眼睛想吃冰淇淋", "D. 外面在下大雨"],
        correct: 1,
        explanation: "👁️ 完全答對！視力模糊就是眼睛在發出求救訊號，要快去遠眺綠樹休息！"
      },
      {
        q: "第 5 題：下列哪一個是壞習慣，會傷害我們的視力？",
        options: ["A. 趴在床上暗處看手機", "B. 每天到公園放風箏", "C. 用眼 30 分鐘遠眺綠樹", "D. 多吃深綠色蔬菜"],
        correct: 0,
        explanation: "🚫 正確！在暗處看螢幕會讓光線劇烈刺激黃斑部，絕對要避免喔！"
      }
    ];

    let studentName = "護眼智慧小達人";
    let currentQ = 0;
    let score = 0;
    let answered = false;

    function startQuiz() {
      const nameInput = document.getElementById('student-name-input').value.trim();
      if (nameInput) studentName = nameInput;
      document.getElementById('user-cert-name').innerText = studentName;

      const today = new Date();
      document.getElementById('cert-date-str').innerText = `頒發日期：${today.getFullYear()} 年 ${today.getMonth() + 1} 月 ${today.getDate()} 日`;

      document.getElementById('start-card').style.display = 'none';
      document.getElementById('quiz-card').style.display = 'block';
      renderQuestion();
    }

    function renderQuestion() {
      answered = false;
      const qData = questions[currentQ];
      document.getElementById('progress-text').innerText = `關卡進度：${currentQ + 1} / ${questions.length}`;
      document.getElementById('question-text').innerText = qData.q;

      const feedback = document.getElementById('feedback-banner');
      feedback.style.display = 'none';
      feedback.className = 'feedback-banner';

      document.getElementById('btn-next').style.display = 'none';

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      qData.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => selectOption(idx, btn);
        container.appendChild(btn);
      });
    }

    function selectOption(idx, btnEl) {
      if (answered) return;
      answered = true;

      const qData = questions[currentQ];
      const feedback = document.getElementById('feedback-banner');
      const allBtns = document.querySelectorAll('.option-btn');

      allBtns.forEach((b, i) => {
        if (i === qData.correct) {
          b.style.background = 'rgba(16, 185, 129, 0.4)';
          b.style.borderColor = '#10B981';
        } else if (i === idx) {
          b.style.background = 'rgba(239, 68, 68, 0.4)';
          b.style.borderColor = '#EF4444';
        }
      });

      if (idx === qData.correct) {
        score += 20;
        feedback.className = 'feedback-banner correct';
        feedback.innerText = qData.explanation;
      } else {
        feedback.className = 'feedback-banner incorrect';
        feedback.innerText = "❌ 答錯囉！" + qData.explanation;
      }

      feedback.style.display = 'block';
      document.getElementById('score-text').innerText = `目前得分：${score} 分`;
      document.getElementById('btn-next').style.display = 'inline-block';
    }

    function nextQuestion() {
      currentQ++;
      if (currentQ < questions.length) {
        renderQuestion();
      } else {
        document.getElementById('quiz-card').style.display = 'none';
        document.getElementById('certificate-box').style.display = 'block';
      }
    }
  </script>
</body>
</html>
